[build]
  publish = "dist"
  command = "pip install -r backend/functions/requirements.txt --target=./.netlify/functions/deps && npm run build"
  functions = "backend/functions"

[build.environment]
  PYTHON_VERSION = "3.9"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
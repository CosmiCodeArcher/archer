[build]
  publish = "dist"
  command = "cp -r backend/functions/* netlify/functions/ && pip install -r netlify/functions/requirements.txt --target=netlify/functions/deps && npm run build"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.9"
  NETLIFY_PYTHON_REQUIREMENTS_PATH = "backend/functions/requirements.txt"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200